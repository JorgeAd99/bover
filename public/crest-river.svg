<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <clipPath id="riverShield">
      <path d="M50 5 C85 5, 95 20, 95 65 C95 95, 65 112, 50 118 C35 112, 5 95, 5 65 C5 20, 15 5, 50 5 Z" />
    </clipPath>
  </defs>
  <!-- Background Shield White -->
  <path d="M50 5 C85 5, 95 20, 95 65 C95 95, 65 112, 50 118 C35 112, 5 95, 5 65 C5 20, 15 5, 50 5 Z" fill="#ffffff" stroke="#c91024" stroke-width="4"/>
