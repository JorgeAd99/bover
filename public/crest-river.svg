  <!-- Inner circular badge -->
  <circle cx="50" cy="62" r="22" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <!-- CARP text -->
  <text x="50" y="68" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#111111" text-anchor="middle" letter-spacing="0.5">CARP</text>
